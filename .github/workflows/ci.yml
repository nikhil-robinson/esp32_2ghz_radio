name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pyserial
      - name: Generated headers are current
        run: python tools/gen_protocol.py --check
      - name: Host unit tests (C + Python)
        run: python -m unittest discover -s tests/host -v

  firmware:
    needs: host-tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.0, release-v5.1, release-v5.2, release-v5.3, release-v5.4, release-v5.5]
    container: espressif/idf:${{ matrix.idf }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          idf.py -C firmware set-target esp32s3
          idf.py -C firmware build
      - uses: actions/upload-artifact@v4
        with:
          name: esp_sdr_fw-${{ matrix.idf }}
          path: |
            firmware/build/esp_sdr_fw.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
          retention-days: 30
